name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - run: npm ci

      # Content index, reel checker, TypeScript, ESLint and tests.
      - run: npm run check

      # Real ad keys come from repository secrets. Without them the app shows sample ads.
      - run: npx tsx scripts/write-env.ts
        env:
          APPLOVIN_SDK_KEY: ${{ secrets.APPLOVIN_SDK_KEY }}
          APPLOVIN_NATIVE_AD_UNIT_ID: ${{ secrets.APPLOVIN_NATIVE_AD_UNIT_ID }}

      # A test build that runs without a computer: JavaScript is bundled inside the APK
      # and it is signed with the debug key. It is not a Play Store release.
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: hookd-test-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
